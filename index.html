<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desi Thadaka | India Ka Apna Snack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PART 1 - HERO SECTION
    ========================== -->

    <section class="hero">

        <!-- Decorative orange brush -->
        <div class="orange-brush brush-one"></div>
        <div class="orange-brush brush-two"></div>

        <!-- Decorative purple shapes -->
        <div class="purple-shape purple-one"></div>
        <div class="purple-shape purple-two"></div>

        <!-- Top left small badge -->
        <div class="india-badge">
            INDIA KA<br>
            APNA SNACK
        </div>

        <!-- Main Brand Area -->
        <div class="hero-content">

            <div class="brand-circle">
                <span>✦</span>
            </div>

            <h1>
                <span class="desi">Desi</span>
                <span class="thadaka">THADAKA</span>
            </h1>

            <div class="brand-line"></div>

            <p class="tagline">
                BOLD FLAVOURS. DESI CRAVINGS.
            </p>

            <p class="sub-tagline">
                INDIA KA APNA SNACK
            </p>

        </div>

        <!-- Price Badge -->
        <div class="price-box">

            <p class="starting">
                STARTING AT
            </p>

            <div class="price">
                ₹5
            </div>

            <p class="only">
                ONLY
            </p>

        </div>

        <!-- Desi Swad badge -->
        <div class="swad-badge">
            <span>DESI SWAAD</span>
            <small>MADE FOR INDIA</small>
        </div>

        <!-- Bottom decorative area -->
        <div class="bottom-decoration">

            <div class="landmark">
                <div class="dome"></div>
                <div class="building">
                    DESI
                </div>
            </div>

        </div>

    </section>

</body>
</html>
