<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desi Thadaka</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         PART 1 — HERO SECTION
    =============================== -->

    <section class="hero">

        <!-- Decorative orange shape -->
        <div class="hero-orange-shape"></div>

        <!-- Decorative purple shape -->
        <div class="hero-purple-shape"></div>


        <!-- Navigation -->

        <header class="navbar">

            <div class="logo">
                <span>DESI</span>
                <strong>THADAKA</strong>
            </div>

            <nav class="nav-links">

                <a href="#">HOME</a>
                <a href="#">SNACKS</a>
                <a href="#">ABOUT</a>
                <a href="#">CONTACT</a>

            </nav>

            <div class="menu-box">
                ☰
            </div>

        </header>


        <!-- Hero Content -->

        <div class="hero-content">

            <div class="hero-text">

                <p class="small-title">
                    INDIA KA APNA SNACK
                </p>

                <h1>
                    DESI
                    <span>THADAKA</span>
                </h1>

                <div class="brush-line"></div>

                <p class="hero-description">
                    Bold flavours. Crazy crunch.
                    <br>
                    Pure desi taste in every bite.
                </p>

                <div class="hero-buttons">

                    <a href="#" class="primary-btn">
                        EXPLORE SNACKS
                    </a>

                    <a href="#" class="secondary-btn">
                        ABOUT US
                    </a>

                </div>

            </div>


            <!-- Product Visual -->

            <div class="hero-product">

                <div class="product-circle">

                    <div class="product-name">
                        DESI
                    </div>

                    <div class="product-main">
                        SNACK
                    </div>

                    <div class="product-sub">
                        ORIGINAL FLAVOUR
                    </div>

                </div>


                <!-- Price -->

                <div class="price-badge">

                    <small>
                        STARTING
                    </small>

                    <strong>
                        ₹5
                    </strong>

                    <span>
                        ONLY
                    </span>

                </div>


                <!-- Decorative text -->

                <div class="vertical-text">
                    BOLD • CRISPY • DESI
                </div>

            </div>

        </div>


        <!-- Bottom Strip -->

        <div class="hero-bottom">

            <span>
                POTATO CHIPS
            </span>

            <span>
                PEANUT & NUT
            </span>

            <span>
                MOONG DAL
            </span>

            <span>
                DESI MASALA
            </span>

        </div>

    </section>

</body>
</html>
